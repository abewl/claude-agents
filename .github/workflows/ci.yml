      # Examples: npm test -- --coverage | pytest --cov | go test ./...
      - name: Test
        run: |
          # npm test -- --coverage
          echo "TODO: add test step"

      # ── Claude Code PR review ─────────────────────────────────────────────
      # Runs on pull_request events only. Reviews against CLAUDE.md standards
      # and SPEC.md acceptance criteria. Requires ANTHROPIC_API_KEY secret.
      - name: Claude Code Review
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          task: |
            Review this PR against CLAUDE.md coding standards and SPEC.md acceptance criteria.
            Check for: coverage gaps, failing AC items, code quality issues, hardcoded secrets,
            and any direct commits to main. Comment with a structured summary.
